// ============================================================================
// 3D Fractal Noise Engine — fBm, Ridged, Domain Warp
// ============================================================================
// Permutation table for hash-based noise
const PERM = new Uint8Array(512);
for (let i = 0; i < 256; i++) PERM[i] = PERM[i+256] = i;
// Fisher-Yates shuffle with fixed seed for reproducibility
let seed = 42;
function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i+1)); [PERM[i], PERM[j]] = [PERM[j], PERM[i]]; }
for (let i = 0; i < 256; i++) PERM[i+256] = PERM[i];

function fade(t) { return t*t*t*(t*(t*6-15)+10); }
function lerp(a,b,t) { return a+t*(b-a); }
function grad3d(hash, x, y, z) {
  const h = hash & 15;
  const u = h < 8 ? x : y;
  const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
  return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
}

// 3D Simplex-like noise (improved Perlin)
function noise3D(x, y, z) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const u = fade(x), v = fade(y), w = fade(z);
  const A = PERM[X] + Y, AA = PERM[A] + Z, AB = PERM[A+1] + Z;
  const B = PERM[X+1] + Y, BA = PERM[B] + Z, BB = PERM[B+1] + Z;
  return lerp(
    lerp(lerp(grad3d(PERM[AA],x,y,z), grad3d(PERM[BA],x-1,y,z), u),
         lerp(grad3d(PERM[AB],x,y-1,z), grad3d(PERM[BB],x-1,y-1,z), u), v),
    lerp(lerp(grad3d(PERM[AA+1],x,y,z-1), grad3d(PERM[BA+1],x-1,y,z-1), u),
         lerp(grad3d(PERM[AB+1],x,y-1,z-1), grad3d(PERM[BB+1],x-1,y-1,z-1), u), v), w
  );
}

// Fractal Brownian Motion — layered noise octaves
function fbm(x, y, z, octaves=6, persistence=0.5, lacunarity=2.0) {
  let value=0, amplitude=1, frequency=1, maxValue=0;
  for (let i=0; i<octaves; i++) {
    value += amplitude * noise3D(x*frequency, y*frequency, z*frequency);
    maxValue += amplitude;
    amplitude *= persistence;
    frequency *= lacunarity;
  }
  return value / maxValue; // normalize to [-1, 1]
}

// Ridged multifractal — creates mountain ridges
function ridgedMF(x, y, z, octaves=6, persistence=0.5, lacunarity=2.0) {
  let value=0, amplitude=1, frequency=1, maxValue=0;
  for (let i=0; i<octaves; i++) {
    let n = Math.abs(noise3D(x*frequency, y*frequency, z*frequency));
    n = 1 - n; // invert: peaks become ridges
    n *= n;    // sharpen
    value += n * amplitude;
    maxValue += amplitude;
    amplitude *= persistence;
    frequency *= lacunarity;
  }
  return value / maxValue;
}

// Domain-warped noise — organic flowing terrain
function domainWarp(x, y, z, octaves=4) {
  const warp1 = fbm(x+1.3, y+2.7, z+0.9, 3, 0.5, 2.0) * 1.5;
  const warp2 = fbm(x+warp1+4.1, y+warp1+1.3, z+warp1+2.5, 3, 0.5, 2.0) * 1.2;
  return fbm(x+warp2*2, y+warp2*2, z+warp2*2, octaves, 0.55, 2.1);
}

    lifeName: {prey:'Ore Mite', pred:'Void Drifter', plant:'Mineral Node'}
  }
];

let currentPlanet = 0;
let mandelHeightData = null;

function generatePlanetData(typeIdx, size) {
  const type = PLANET_TYPES[typeIdx];
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  const heightData = new Float32Array(size * size);
  const pal = type.palette;
  const isNoise = type.genType === 'noise';

  function palColor(v) {
    v = Math.max(0, Math.min(1, v));
    const idx = Math.min(Math.floor(v * (pal.length - 1)), pal.length - 2);
    const frac = v * (pal.length - 1) - idx;
    const c1 = pal[idx], c2 = pal[idx + 1];
    return [
      Math.floor(c1[0] + (c2[0]-c1[0])*frac),
      Math.floor(c1[1] + (c2[1]-c1[1])*frac),
      Math.floor(c1[2] + (c2[2]-c1[2])*frac)
    ];
  }

  function smoothstep(e0, e1, x) {
    const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  }

  // Pre-cache noise values if using noise-based generation
  // Sample 3D noise at sphere surface positions
  const mi = 80;
  const oct = type.noiseOctaves || 6;
  const persist = type.noisePersist || 0.5;
  const lac = type.noiseLac || 2.0;

  for (let px = 0; px < size; px++) {
    for (let py = 0; py < size; py++) {
      let rawV;

      if (isNoise) {
        // Convert UV to 3D position on unit sphere, sample noise
        const u = px / size, v = py / size;
        const theta = u * PI * 2;
        const phi = v * PI;
        const sx = Math.sin(phi) * Math.cos(theta);
        const sy = Math.cos(phi);
        const sz = Math.sin(phi) * Math.sin(theta);

        let nv;
        switch (type.noiseFn) {
          case 'ridged': nv = ridgedMF(sx, sy, sz, oct, persist, lac); break;
          case 'domainWarp': nv = domainWarp(sx, sy, sz, oct); break;
          default: nv = fbm(sx, sy, sz, oct, persist, lac); break;
        }
        rawV = (nv + 1) / 2; // normalize from [-1,1] to [0,1]
      } else {
        // Fractal iteration
        const cr = -2.0 + (px / size) * 3.0 * GM;
        const ci = -1.5 + (py / size) * 3.0;
        let zr = 0, zi = 0, it = 0, escaped = false;
        while (it < mi) {
          const n = type.fn(zr, zi, cr, ci);
          zr = n.zr; zi = n.zi;
          if (zr*zr + zi*zi > 4) { escaped = true; break; }
          it++;
        }
        rawV = escaped ? it / mi : 1.0;
      }

      let height;
      if (rawV < 0.15) height = SEA_LEVEL * smoothstep(0, 0.15, rawV);
      else if (rawV < 0.5) height = SEA_LEVEL + (DISPLACEMENT * 0.3) * smoothstep(0.15, 0.5, rawV);
      else if (rawV < 0.85) height = DISPLACEMENT * 0.3 + (DISPLACEMENT * 0.5) * smoothstep(0.5, 0.85, rawV);
      else height = DISPLACEMENT * 0.8 + (DISPLACEMENT * 0.2) * smoothstep(0.85, 1.0, rawV);
      heightData[py * size + px] = height;

      const [r, g, b] = palColor(rawV);
      const i = (py * size + px) * 4;
      img.data[i] = r; img.data[i+1] = g; img.data[i+2] = b; img.data[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return { colorTex: new THREE.CanvasTexture(canvas), heightData };
}

function sampleHeight(theta, phi, size) {
  if (!mandelHeightData) return 0;
  const u = ((theta / (PI * 2)) % 1 + 1) % 1;
  const v = Math.max(0, Math.min(1, phi / PI));
  const px = Math.floor(u * (size - 1));
  const py = Math.floor(v * (size - 1));
  return mandelHeightData[py * size + px] || 0;
}

// ============================================================================
// Neural Network
// ============================================================================
class NN {
  constructor(inS, hidS, outS) {
    this.inS=inS; this.hidS=hidS; this.outS=outS;
    this.w1=Array.from({length:inS},()=>Array.from({length:hidS},()=>Math.random()*2-1));
    this.w2=Array.from({length:hidS},()=>Array.from({length:outS},()=>Math.random()*2-1));
    this.mem=[];
  }
  sig(x){return 1/(1+Math.exp(-x))}
  ff(input){
    if(input.length!==this.inS)return Array(this.outS).fill(0);
    const hR=this._mm(input,this.w1), hA=hR.map(this.sig);
    const oR=this._mm(hA,this.w2); return oR.map(this.sig);
  }
  _mm(a,b){
    const res=Array(b[0].length).fill(0);
    for(let i=0;i<b[0].length;i++) for(let j=0;j<a.length;j++) res[i]+=a[j]*b[j][i];
    return res;
  }
  trainQ(state,action,reward,nextState,alpha=0.1,gamma=0.9){
    if(action<0||action>=this.outS)return;
    const hR=this._mm(state,this.w1),hA=hR.map(this.sig);
    const oR=this._mm(hA,this.w2),oA=oR.map(this.sig);
    const curQ=oA[action],nextQ=Math.max(...this.ff(nextState));
    const err=reward+gamma*nextQ-curQ,oDelta=err*oA[action]*(1-oA[action]);
    const hDelta=Array(this.hidS).fill(0);
    for(let j=0;j<this.hidS;j++)hDelta[j]=oDelta*this.w2[j][action]*hA[j]*(1-hA[j]);
    for(let j=0;j<this.hidS;j++)this.w2[j][action]+=alpha*oDelta*hA[j];
    for(let i=0;i<this.inS;i++)for(let j=0;j<this.hidS;j++)this.w1[i][j]+=alpha*hDelta[j]*state[i];
  }
  trainBatch(batch){batch.forEach(e=>this.trainQ(e.state,e.action,e.reward,e.nextState))}
  addNode(){
    this.hidS++; this.w1=this.w1.map(r=>[...r,Math.random()*2-1]);
    this.w2.push(Array.from({length:this.outS},()=>Math.random()*2-1));
    this.mem.push({t:'node'});
  }
  addLayer(size){
    const oH=this.hidS,oW1=this.w1,oW2=this.w2;
    this.w1=Array.from({length:this.inS},()=>Array.from({length:size},()=>Math.random()*2-1));
    this.w2=Array.from({length:size},()=>Array.from({length:this.outS},()=>Math.random()*2-1));
    this.hidS=size; const r=size/oH;
    for(let i=0;i<this.inS;i++)for(let j=0;j<oH;j++)this.w1[i][Math.floor(j*r)]=(this.w1[i][Math.floor(j*r)]+oW1[i][j])/2;
    for(let j=0;j<oH;j++){const ni=Math.floor(j*r);for(let k=0;k<this.outS;k++)this.w2[ni][k]=(this.w2[ni][k]+oW2[j][k])/2;}
    this.mem.push({t:'layer',s:size});
  }
}

// ============================================================================
// Simulation — spherical coordinates on planet surface
// ============================================================================
const SIM = {
  animals:[], microbes:[], env:{grass:[],shrubs:[],trees:[]},
  mNN:new NN(4,5,1), epsilon:0.1,
  replayBuf:[], bufSize:1000, batchSize:32,
  paused:false, voiceInput:'', lastOODA:0,
  logs:[], speed:1,

  createAnimal(type){
    const planet = PLANET_TYPES[currentPlanet];
    const lifeName = type==='Prey' ? planet.lifeName.prey : planet.lifeName.pred;
    return {
      type,
      lifeName,  // planet-specific name
      theta:Math.random()*PI*2,
      phi:Math.random()*PI,
      speed:type==='Prey'?Math.random()*0.2+0.15:Math.random()*0.25+0.18,  // predators faster
      mass:type==='Prey'?Math.random()*30+10:Math.random()*50+30,
      energy:type==='Prey'?Math.random()*300+400:Math.random()*800+1500,     // predators more energy
      nn:new NN(6,4,3), complexity:1
    };
  },

  reset(){
    this.animals=[]; this.microbes=[]; this.env={grass:[],shrubs:[],trees:[]};
    for(let i=0;i<12;i++) this.env.grass.push({
      theta:Math.random()*PI*2, phi:Math.random()*PI,
      density:Math.random()*0.5+0.5, energyYield:1
    });
    for(let i=0;i<6;i++) this.env.shrubs.push({
      theta:Math.random()*PI*2, phi:Math.random()*PI,
      density:1, energyYield:Math.random()>0.5?2:1.5, radius:Math.random()*0.3+0.1
    });
    for(let i=0;i<4;i++) this.env.trees.push({
      theta:Math.random()*PI*2, phi:Math.random()*PI, stability:Math.random()*0.7+0.8
    });
    for(let i=0;i<8;i++) this.microbes.push({
      theta:Math.random()*PI*2, phi:Math.random()*PI,
      activity:Math.random()*0.3+0.2, nutrientBoost:Math.random()*0.05+0.02
    });
    for(let i=0;i<4;i++) this.animals.push(this.createAnimal(i%2?'Predator':'Prey'));
    this.log('Planet seeded','system');
  },

  // Great-circle distance on sphere
  _dist(a,b){
    const dTheta=Math.abs(a.theta-b.theta), dPhi=Math.abs(a.phi-b.phi);
    // Haversine approximation for small distances
    const a2=Math.sin(dPhi/2)**2+Math.cos(a.phi)*Math.cos(b.phi)*Math.sin(dTheta/2)**2;
    return 2*Math.atan2(Math.sqrt(a2),Math.sqrt(1-a2));
  },

  _nearest(items,ref){
    if(!items.length)return null;
    return items.reduce((a,b)=>this._dist(a,ref)<this._dist(b,ref)?a:b);
  },

  animalState(a){
    const nf=a.type==='Prey'
      ?this._nearest([...this.env.grass,...this.env.shrubs],a)
      :this._nearest(this.animals.filter(x=>x.type==='Prey'&&x!==a),a);
    const nt=a.type==='Prey'
      ?this._nearest(this.animals.filter(x=>x.type==='Predator'),a):null;
    const fd=nf?this._dist(a,nf):1, td=nt?this._dist(a,nt):1;
    return [
      Math.min(1,a.energy/(a.type==='Prey'?700:2500)),
      Math.min(1,a.speed/0.25),
      Math.min(1,a.mass/80),
      Math.min(1,fd/PI),
      Math.min(1,(a.type==='Prey'?td:fd)/PI),
      Math.random()
    ];
  },

  tick(){
    if(this.paused)return;
    for(const a of [...this.animals]){
      const state=this.animalState(a);
      let reward=0.01;
      const qv=a.nn.ff(state);
      const action=Math.random()<this.epsilon?Math.floor(Math.random()*3):qv.indexOf(Math.max(...qv));

      const nf=a.type==='Prey'
        ?this._nearest([...this.env.grass,...this.env.shrubs],a)
        :this._nearest(this.animals.filter(x=>x.type==='Prey'&&x!==a),a);
      const nt=a.type==='Prey'
        ?this._nearest(this.animals.filter(x=>x.type==='Predator'),a):null;
      const fd=nf?this._dist(a,nf):1, td=nt?this._dist(a,nt):1;

      // Move on sphere surface — FASTER, LESS COSTLY
      if(action===0&&nf){
        const dTheta=nf.theta-a.theta, dPhi=nf.phi-a.phi;
        const d=Math.hypot(dTheta,dPhi)||0.001;
        a.theta+=(dTheta/d)*a.speed*0.06;   // 3x faster
        a.phi+=(dPhi/d)*a.speed*0.06;
        a.energy-=3+a.mass*0.05;              // half cost
      }else if(action===2&&nt&&a.type==='Prey'){
        const dTheta=a.theta-nt.theta, dPhi=a.phi-nt.phi;
        const d=Math.hypot(dTheta,dPhi)||0.001;
        a.theta+=(dTheta/d)*a.speed*0.08;    // fast flee
        a.phi+=(dPhi/d)*a.speed*0.08;
        a.energy-=5+a.mass*0.1; if(td>0.5)reward=-0.5;
      }else if(action===2&&nf&&a.type==='Predator'){
        const dTheta=nf.theta-a.theta, dPhi=nf.phi-a.phi;
        const d=Math.hypot(dTheta,dPhi)||0.001;
        a.theta+=(dTheta/d)*a.speed*0.08;    // fast hunt
        a.phi+=(dPhi/d)*a.speed*0.08;
        a.energy-=4+a.mass*0.08;              // lower cost
      }else if(action===1&&fd<0.2&&nf){         // wider eat range
        if(a.type==='Prey'){
          a.energy+=250*nf.density*(nf.energyYield||1);
          nf.density*=0.5;
          if(nf.density<0.1){
            this.env.grass=this.env.grass.filter(g=>g!==nf);
            this.env.shrubs=this.env.shrubs.filter(s=>s!==nf);
          }
        }else{
          a.energy+=600; this.animals=this.animals.filter(x=>x!==nf);
        }
        reward=1;
      }
      // Wrap around sphere
      a.theta=((a.theta%(PI*2))+PI*2)%(PI*2);
      a.phi=Math.max(0.05,Math.min(PI-0.05,a.phi));

      const ns=this.animalState(a);
      this.replayBuf.push({state,action,reward,nextState:ns});
      if(this.replayBuf.length>this.bufSize)this.replayBuf.shift();
      if(this.replayBuf.length>=this.batchSize){
        const batch=Array.from({length:this.batchSize},()=>this.replayBuf[Math.floor(Math.random()*this.replayBuf.length)]);
        a.nn.trainBatch(batch);
      }
      const thr=a.type==='Prey'?700:2500;
      if(a.energy>thr&&Math.random()<0.0001*a.complexity){
        a.complexity++; Math.random()<0.7?a.nn.addNode():a.nn.addLayer(4);
        this.log(`${a.lifeName||a.type} evolved! c=${a.complexity}`,'evolve');
      }
      if(a.energy<0)this.animals=this.animals.filter(x=>x!==a);
    }
    this.epsilon=Math.max(0.01,this.epsilon*0.995);

    // Microbes
    for(const m of [...this.microbes]){
      const dead=[...this.env.grass,...this.env.shrubs].filter(i=>i.density<0.2);
      const near=this._nearest(dead,m);
      if(near&&this._dist(m,near)<0.1){near.density+=m.nutrientBoost;m.activity-=0.005;}
      if(Math.random()<m.activity){
        m.theta+=(Math.random()-0.5)*0.03; m.phi+=(Math.random()-0.5)*0.03;
        m.theta=((m.theta%(PI*2))+PI*2)%(PI*2);
        m.phi=Math.max(0.05,Math.min(PI-0.05,m.phi));
      }
      if(Math.random()<0.01){
        this.env.grass.push({
          theta:m.theta+(Math.random()-0.5)*0.1, phi:m.phi+(Math.random()-0.5)*0.1,
          density:Math.random()*0.3+0.3, energyYield:1
        });
      }
    }
    this.microbes=this.microbes.filter(m=>m.activity>0);

    // Events
    if(Math.random()<0.02){
      if(Math.random()<0.5){
        this.animals.forEach(a=>a.energy*=0.8);
        this.log('Solar storm!','storm');
      }else{
        this.env.grass.forEach(g=>g.density=Math.min(2,g.density*1.3));
        this.log('Atmospheric surge!','surge');
      }
    }

    // OODA
    if(performance.now()-this.lastOODA>5000){
      this.lastOODA=performance.now();
      const sit=this.mNN.ff([0.8,0.5,this.voiceInput.length/100,0.5])[0];
      if(sit>0.7){this.mNN.addNode();this.log(`Mandelbrot NN +node (${sit.toFixed(2)})`,'system');}
      else if(sit<0.3){this.mNN.addLayer(6);this.log(`Mandelbrot NN +layer (${sit.toFixed(2)})`,'system');}
    }
  },

  log(msg,cls=''){this.logs.push({msg,cls,time:Date.now()});if(this.logs.length>50)this.logs=this.logs.slice(-30);},
  spawn(type){
    const a=this.createAnimal(type); this.animals.push(a);
    this.log(`Spawned ${a.lifeName||type}`,'system');
  },
  eatAll(){
    for(const a of this.animals){
      const nf=a.type==='Prey'
        ?this._nearest([...this.env.grass,...this.env.shrubs],a)
        :this._nearest(this.animals.filter(x=>x.type==='Prey'&&x!==a),a);
      if(nf&&this._dist(a,nf)<0.2){
        if(a.type==='Prey'){a.energy+=250*nf.density*(nf.energyYield||1);nf.density*=0.5;}
        else{a.energy+=600;this.animals=this.animals.filter(x=>x!==nf);}
      }
    }
  },
  growGrass(){
    for(let i=0;i<5;i++) this.env.grass.push({
      theta:Math.random()*PI*2,phi:Math.random()*PI,density:Math.random()*0.5+0.5,energyYield:1
    });
    this.log('Grass seeded','surge');
  },
  saveWeights(){} // stub
};

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// Camera
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.5, 100);
camera.position.set(3, 6, 12);
camera.lookAt(0, 0, 0);

// Orbit Controls

// Stars
const starsGeo = new THREE.BufferGeometry();

for (let i = 0; i < starCount; i++) {
  const r = 40 + Math.random() * 60;

  const phi = Math.acos(2 * Math.random() - 1);
  starPositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
  starPositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  starPositions[i*3+2] = r * Math.cos(phi);
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starsMat = new THREE.PointsMaterial({color:0xffffff, size:0.08, transparent:true, opacity:0.7});
const stars = new THREE.Points(starsGeo, starsMat);
scene.add(stars);

// Planet — dynamically built from current planet type
let planet, wireframe, atmosphere;
const TEX_SIZE = 512;

function buildPlanet(idx) {
  // Remove old planet objects
  if (planet) { scene.remove(planet); if (planet.geometry) planet.geometry.dispose(); if (planet.material) planet.material.dispose(); }
  if (wireframe) { scene.remove(wireframe); if (wireframe.geometry) wireframe.geometry.dispose(); if (wireframe.material) wireframe.material.dispose(); }
  if (atmosphere) { scene.remove(atmosphere); if (atmosphere.geometry) atmosphere.geometry.dispose(); if (atmosphere.material) atmosphere.material.dispose(); }

  const type = PLANET_TYPES[idx];
  console.log(`Building planet: ${type.emoji} ${type.name} — ${type.desc}`);

  const data = generatePlanetData(idx, TEX_SIZE);
  const planetTex = data.colorTex;
  planetTex.colorSpace = THREE.SRGBColorSpace;
  mandelHeightData = data.heightData;

  // Replace planet texture
  if (planet) { planet.material.map = planetTex; planet.material.needsUpdate = true; }

  // Create sphere and displace vertices based on height map
  const planetGeo = new THREE.SphereGeometry(PLANET_R, 128, 96);
  const positions = planetGeo.attributes.position;
  const normals = planetGeo.attributes.normal;

  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i), y = positions.getY(i), z = positions.getZ(i);
    const nx = normals.getX(i), ny = normals.getY(i), nz = normals.getZ(i);
    const r = Math.sqrt(x*x + y*y + z*z);
    const phi = Math.acos(y / r), theta = Math.atan2(z, x);
    const u = ((theta / (PI * 2)) % 1 + 1) % 1;
    const v = Math.max(0, Math.min(1, phi / PI));
    const px = Math.floor(u * (TEX_SIZE - 1));
    const py = Math.floor(v * (TEX_SIZE - 1));
    const h = mandelHeightData[py * TEX_SIZE + px] || 0;
    positions.setXYZ(i, x + nx * h, y + ny * h, z + nz * h);
  }
  planetGeo.computeVertexNormals();

  const planetMat = new THREE.MeshStandardMaterial({
    map: planetTex, roughness: 0.7, metalness: 0.1, flatShading: false
  });
  planet = new THREE.Mesh(planetGeo, planetMat);
  scene.add(planet);

  // Wireframe overlay
  const wireGeo = new THREE.SphereGeometry(PLANET_R, 128, 96);
  const wPositions = wireGeo.attributes.position;
  const wNormals = wireGeo.attributes.normal;
  for (let i = 0; i < wPositions.count; i++) {
    const x = wPositions.getX(i), y = wPositions.getY(i), z = wPositions.getZ(i);
    const r2 = Math.sqrt(x*x+y*y+z*z);
    const phi = Math.acos(y/r2), theta = Math.atan2(z, x);
    const u = ((theta/(PI*2))%1+1)%1, v = Math.max(0,Math.min(1,phi/PI));
    const px2 = Math.floor(u*(TEX_SIZE-1)), py2 = Math.floor(v*(TEX_SIZE-1));
    const h = mandelHeightData[py2*TEX_SIZE+px2]||0;
    wPositions.setXYZ(i, x+wNormals.getX(i)*h*1.01, y+wNormals.getY(i)*h*1.01, z+wNormals.getZ(i)*h*1.01);
  }
  const wireMat = new THREE.MeshBasicMaterial({color:0x001a00, wireframe:true, transparent:true, opacity:0.08});
  wireframe = new THREE.Mesh(wireGeo, wireMat);
  scene.add(wireframe);

  // Atmosphere glow
  const atmoGeo = new THREE.SphereGeometry(PLANET_R + DISPLACEMENT + 0.2, 64, 48);
  const atmoMat = new THREE.ShaderMaterial({
    uniforms: {},
    vertexShader: `
      varying vec3 vNormal; varying vec3 vPosition;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vPosition = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vNormal; varying vec3 vPosition;
      void main() {
        float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
        gl_FragColor = vec4(0.1, 0.5, 1.0, 0.4) * intensity;
      }
    `,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
  });
  atmosphere = new THREE.Mesh(atmoGeo, atmoMat);
  scene.add(atmosphere);

  // Update HUD
  document.getElementById('s-planet').textContent = type.emoji + ' ' + type.name;
}

function cyclePlanet(dir=1) {
  currentPlanet = (currentPlanet + dir + PLANET_TYPES.length) % PLANET_TYPES.length;
  buildPlanet(currentPlanet);
  SIM.log(`Planet: ${PLANET_TYPES[currentPlanet].emoji} ${PLANET_TYPES[currentPlanet].name}`,'system');
  updateEcosystem();
}

// Ecosystem objects
const ecosystemGroup = new THREE.Group();
scene.add(ecosystemGroup);

// Pre-created geometries
const preyGeo = new THREE.SphereGeometry(0.08, 8, 6);
const predGeo = new THREE.SphereGeometry(0.10, 8, 6);
const grassGeo = new THREE.SphereGeometry(0.04, 4, 3);
const shrubGeo = new THREE.SphereGeometry(0.06, 6, 4);
const treeGeo = new THREE.ConeGeometry(0.05, 0.15, 4);
const microbeGeo = new THREE.SphereGeometry(0.02, 3, 2);

// Object pools
const objPools = {prey:[],pred:[],grass:[],shrub:[],tree:[],microbe:[]};

function getFromPool(pool, geo, color){
  let obj;
  if(pool.length>0){ obj=pool.pop(); obj.visible=true; }
  else {
    const mat = new THREE.MeshStandardMaterial({color, roughness:0.5, emissive:color, emissiveIntensity:0.3});
    obj = new THREE.Mesh(geo, mat);
    ecosystemGroup.add(obj);
  }
  return obj;
}

function returnToPool(pool, obj){ obj.visible=false; pool.push(obj); }

// Convert spherical to 3D position on planet surface
function spherePos(theta, phi){
  const h = sampleHeight(theta, phi, TEX_SIZE);
  const r = PLANET_R + h + 0.03;
  return new THREE.Vector3(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.cos(phi),
    r * Math.sin(phi) * Math.sin(theta)
  );
}

function updateEcosystem(){
  const type = PLANET_TYPES[currentPlanet];
  const lc = type.lifeColor;
  // RGB array → CSS color helper
  const rgb = (arr) => `rgb(${arr[0]},${arr[1]},${arr[2]})`;

  // Return all to pools
  for(const key of Object.keys(objPools)){
    const pool=objPools[key];
    while(ecosystemGroup.children.length>0){
      const obj=ecosystemGroup.children[0];
      for(const k of Object.keys(objPools)){
        const p=objPools[k];
        if(p.includes(obj)){ obj.visible=false; break; }
      }
      if(obj.visible){ ecosystemGroup.remove(obj); }
      else break;
    }
  }

  for(const key of Object.keys(objPools)) objPools[key]=[];
  while(ecosystemGroup.children.length>0) ecosystemGroup.remove(ecosystemGroup.children[0]);

  // Grass — use plant color
  SIM.env.grass.forEach(g=>{
    const [pr,pg,pb] = lc.plant;
    const c = new THREE.Color().setRGB(pr/255, pg/255, pb/255).multiplyScalar(0.5+g.density*0.5);
    const obj = new THREE.Mesh(grassGeo, new THREE.MeshStandardMaterial({
      color:c, roughness:0.6, emissive:c.clone().multiplyScalar(0.3), emissiveIntensity:0.2
    }));
    obj.position.copy(spherePos(g.theta, g.phi));
    obj.lookAt(new THREE.Vector3(0,0,0));
    ecosystemGroup.add(obj); objPools.grass.push(obj);
  });

  SIM.env.shrubs.forEach(s=>{
    const [pr,pg,pb] = lc.plant;
    const c = new THREE.Color().setRGB(pr/255, pg/255, pb/255);
    const obj = new THREE.Mesh(shrubGeo, new THREE.MeshStandardMaterial({
      color:c, roughness:0.5, emissive:c.clone().multiplyScalar(0.3), emissiveIntensity:0.3
    }));
    obj.position.copy(spherePos(s.theta, s.phi));
    obj.scale.setScalar(0.8+s.radius);
    ecosystemGroup.add(obj); objPools.shrub.push(obj);
  });

  SIM.env.trees.forEach(t=>{
    const [pr,pg,pb] = lc.plant;
    const c = new THREE.Color().setRGB(pr/255, pg/255, pb/255).multiplyScalar(0.6);
    const obj = new THREE.Mesh(treeGeo, new THREE.MeshStandardMaterial({
      color:c, roughness:0.7
    }));
    obj.position.copy(spherePos(t.theta, t.phi));
    const normal = obj.position.clone().normalize();
    const up = new THREE.Vector3(0,1,0);
    const quat = new THREE.Quaternion().setFromUnitVectors(up, normal);
    obj.setRotationFromQuaternion(quat);
    ecosystemGroup.add(obj); objPools.tree.push(obj);
  });

  SIM.microbes.forEach(m=>{
    const [pr,pg,pb] = lc.microbe;
    const c = new THREE.Color().setRGB(pr/255, pg/255, pb/255);
    const obj = new THREE.Mesh(microbeGeo, new THREE.MeshStandardMaterial({
      color:c, roughness:0.3, emissive:c, emissiveIntensity:0.5
    }));
    obj.position.copy(spherePos(m.theta, m.phi));
    ecosystemGroup.add(obj); objPools.microbe.push(obj);
  });

  SIM.animals.forEach(a=>{
    const isPrey = a.type==='Prey';
    const [pr,pg,pb] = isPrey ? lc.prey : lc.pred;
    const v = Math.min(1, a.energy/(isPrey?700:2500));
    const c = new THREE.Color().setRGB(pr/255, pg/255, pb/255).multiplyScalar(0.4+v*0.6);
    const obj = new THREE.Mesh(isPrey?preyGeo:predGeo, new THREE.MeshStandardMaterial({
      color:c, roughness:0.4,
      emissive:new THREE.Color().setRGB(pr/255,pg/255,pb/255).multiplyScalar(0.2),
      emissiveIntensity:0.4
    }));
    obj.position.copy(spherePos(a.theta, a.phi));
    obj.scale.setScalar(0.8+a.complexity*0.15);
    ecosystemGroup.add(obj);
    if(isPrey) objPools.prey.push(obj); else objPools.pred.push(obj);
  });
}

// ============================================================================
// HUD Update
// ============================================================================
function updateHUD(){
  document.getElementById('s-ani').textContent=SIM.animals.length;
  document.getElementById('s-prey').textContent=SIM.animals.filter(a=>a.type==='Prey').length;
  document.getElementById('s-pred').textContent=SIM.animals.filter(a=>a.type==='Predator').length;
  document.getElementById('s-micro').textContent=SIM.microbes.length;
  document.getElementById('s-plant').textContent=SIM.env.grass.length+SIM.env.shrubs.length+SIM.env.trees.length;
  document.getElementById('s-eps').textContent=SIM.epsilon.toFixed(3);
  document.getElementById('s-mnn').textContent=SIM.mNN.hidS;

  const logEl=document.getElementById('log-hud');
  const recent=SIM.logs.slice(-5);
  logEl.innerHTML=recent.map(l=>`<div class="l ${l.cls}">${l.msg}</div>`).join('');
}

// ============================================================================
// Main Loop
// ============================================================================
let tickCounter=0, frameCount=0, lastFpsTime=performance.now();
const fpsEl=document.getElementById('s-fps');

function animate(ts){
  requestAnimationFrame(animate);

  // Simulation ticks
  if(!SIM.paused){
    for(let s=0;s<SIM.speed;s++){
      tickCounter++;
      if(tickCounter%3===0) SIM.tick();
    }
  }

  // Update ecosystem every 4 frames
  if(tickCounter%4===0) updateEcosystem();

  // Rotate stars slowly
  stars.rotation.y += 0.0001;
  stars.rotation.x += 0.00005;

  // Planet rotation (subtle)
  planet.rotation.y += 0.0003;

  // Controls
  controls.update();

  renderer.render(scene, camera);
  updateHUD();

  // FPS
  frameCount++;
  if(ts-lastFpsTime>=1000){ fpsEl.textContent=frameCount; frameCount=0; lastFpsTime=ts; }
}

// ============================================================================
// UI Events
// ============================================================================
document.getElementById('b-pause').addEventListener('click',()=>{SIM.paused=!SIM.paused;SIM.log(SIM.paused?'Paused':'Resumed','system');});
document.getElementById('b-prey').addEventListener('click',()=>SIM.spawn('Prey'));
document.getElementById('b-pred').addEventListener('click',()=>SIM.spawn('Predator'));
document.getElementById('b-grass').addEventListener('click',()=>SIM.growGrass());
document.getElementById('b-eat').addEventListener('click',()=>SIM.eatAll());
document.getElementById('b-reset').addEventListener('click',()=>{SIM.reset();buildPlanet(currentPlanet);updateEcosystem();});
document.getElementById('b-save').addEventListener('click',()=>{SIM.log('Save not implemented','system');});
document.getElementById('b-load').addEventListener('click',()=>{SIM.log('Load not implemented','system');});

// Help
const helpEl=document.getElementById('help');
document.getElementById('b-help').addEventListener('click',()=>{helpEl.style.display='block';});
document.getElementById('b-next').addEventListener('click',()=>cyclePlanet(1));
document.getElementById('b-prev').addEventListener('click',()=>cyclePlanet(-1));
helpEl.addEventListener('click',()=>{helpEl.style.display='none';});

// Voice
let recognition=null, isRecording=false;
const voiceBtn=document.getElementById('b-voice');
function setupVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  recognition=new SR(); recognition.continuous=false; recognition.interimResults=false; recognition.lang='en-US';
  recognition.onresult=e=>{
    const text=e.results[0][0].transcript.toLowerCase();
    SIM.voiceInput=text;
    if(text.includes('pause'))SIM.paused=true; else if(text.includes('resume'))SIM.paused=false;
    else if(text.includes('spawn prey')||text.includes('prey'))SIM.spawn('Prey');
    else if(text.includes('spawn predator')||text.includes('predator'))SIM.spawn('Predator');
    else if(text.includes('eat'))SIM.eatAll();
    else if(text.includes('grow')||text.includes('grass'))SIM.growGrass();
    else if(text.includes('reset'))SIM.reset();
    SIM.log(`Voice: "${text}"`,'system'); stopVoice();
  };
  recognition.onerror=()=>stopVoice(); recognition.onend=()=>stopVoice();
}
function toggleVoice(){
  if(!recognition)setupVoice(); if(!recognition)return;
  if(isRecording)stopVoice(); else{recognition.start();isRecording=true;voiceBtn.classList.add('listening');}
}
function stopVoice(){isRecording=false;voiceBtn.classList.remove('listening');try{recognition.stop();}catch(e){}}
voiceBtn.addEventListener('click',toggleVoice);

// Keyboard
document.addEventListener('keydown',e=>{
  switch(e.key.toLowerCase()){
    case ' ': e.preventDefault(); SIM.paused=!SIM.paused; break;
    case 's': SIM.spawn('Prey'); break;
    case 'd': SIM.spawn('Predator'); break;
    case 'g': SIM.growGrass(); break;
    case 'e': SIM.eatAll(); break;
    case 'r': SIM.reset(); updateEcosystem(); break;
    case 'h': helpEl.style.display=helpEl.style.display==='block'?'none':'block'; break;
    case 'f': // top-down view
      camera.position.set(0,PLANET_R+8,0.1); controls.target.set(0,0,0); controls.update(); break;
    case 't': // tilt view
      camera.position.set(8,3,8); controls.target.set(0,0,0); controls.update(); break;
    case '1': SIM.speed=1; SIM.log('Speed: 1x','system'); break;
    case '2': SIM.speed=2; SIM.log('Speed: 2x','system'); break;
    case '3': SIM.speed=4; SIM.log('Speed: 4x','system'); break;
    case '4': SIM.speed=8; SIM.log('Speed: 8x','system'); break;
    case '5': SIM.speed=16; SIM.log('Speed: 16x ⚡','system'); break;
    case 'n': cyclePlanet(1); break;
    case 'p': if(!e.ctrlKey) break; // only if NOT Ctrl+P (let space handle pause)
  }
});

// Resize
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// ── START ──────────────────────────────────────────────────────────────────
SIM.reset();
buildPlanet(currentPlanet);
updateEcosystem();
setupVoice();
console.log('SEED3 — Planet Life 3D — 16 planets ready');
animate(0);
</script>
